name: Sync EchoStretch Releases

on:
  schedule:
    - cron: '0 0 * * *' # Checks automatically every day at midnight UTC
  workflow_dispatch:     # Allows manual trigger at any time

permissions:
  contents: write

jobs:
  sync-releases:
    runs-on: ubuntu-latest

    env:
      UPSTREAM_REPO: 'EchoStretch/ps5-app-dumper'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Git Tags
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || true
          git fetch upstream --tags
          git push origin --tags || echo "Tags are already up to date"

      - name: Mirror Releases & Assets
        run: |
          echo "Fetching releases in xEasy4Breezy/ps5-app-dumper..."
          FORK_RELEASES=$(gh release list --limit 200 --json tagName -q '.[].tagName')

          echo "Fetching releases from ${UPSTREAM_REPO}..."
          UPSTREAM_TAGS=$(gh release list -R "${UPSTREAM_REPO}" --limit 100 --json tagName -q '.[].tagName')

          for tag in $UPSTREAM_TAGS; do
            # Skip if already imported
            if echo "$FORK_RELEASES" | grep -qx "$tag"; then
              echo "Release $tag already exists. Skipping."
              continue
            fi

            echo "=== Mirroring release: $tag ==="
            TMP_DIR="release_assets_${tag}"
            mkdir -p "$TMP_DIR"

            # Download compiled ELF / payload assets
            echo "Downloading assets from upstream..."
            gh release download "$tag" -R "${UPSTREAM_REPO}" -D "$TMP_DIR" || true

            # Pull metadata
            TITLE=$(gh release view "$tag" -R "${UPSTREAM_REPO}" --json name -q '.name')
            IS_PRERELEASE=$(gh release view "$tag" -R "${UPSTREAM_REPO}" --json isPrerelease -q '.isPrerelease')
            gh release view "$tag" -R "${UPSTREAM_REPO}" --json body -q '.body' > "$TMP_DIR/notes.md"

            FLAGS=()
            if [ "$IS_PRERELEASE" = "true" ]; then
              FLAGS+=(--prerelease)
            fi

            # Collect binaries/payloads to re-upload
            ASSETS=()
            for file in "$TMP_DIR"/*; do
              if [ -f "$file" ] && [ "$(basename "$file")" != "notes.md" ]; then
                ASSETS+=("$file")
              fi
            done

            echo "Creating release on xEasy4Breezy/ps5-app-dumper..."
            gh release create "$tag" \
              --title "${TITLE:-$tag}" \
              --notes-file "$TMP_DIR/notes.md" \
              "${FLAGS[@]}" \
              "${ASSETS[@]}" || echo "Failed to push release $tag"

            rm -rf "$TMP_DIR"
          done
